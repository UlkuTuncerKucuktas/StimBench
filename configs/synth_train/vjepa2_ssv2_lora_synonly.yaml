# Synthetic-only training (P2): train on StimBench-Syn alone, test on the real test split.
# Real training clips are excluded by pointing the real split filter at an empty fraction:
# the loader still builds the real test set from dataset.path.
experiment:
  name: vjepa2_ssv2_lora_synonly
  seed: 42
model:
  type: hf_peft
  family: vjepa2
  backbone: facebook/vjepa2-vitl-fpc16-256-ssv2
  adapter: { type: lora, r: 16, alpha: 32, dropout: 0.15 }
dataset:
  path: UlkuTuncerKucuktas/StimBench
  classes: [armflapping, headbanging, normal, spinning]
  real_train_fraction: 0.0
  synthetic:
    path: /storage/pvc-trubaai-1tb/siu/synth_v2
    fraction: 1.0
preprocessing:
  num_frames: 16
  stride: 4
  resize: 256
  augmentation: { horizontal_flip: 0.5, temporal_reverse: 0.1 }
training:
  epochs: 30
  batch_size: 4
  balanced_sampling: true
  fp16: true
  optimizer: { type: adamw, lr: 0.0003, weight_decay: 0.05 }
  scheduler: { type: cosine, eta_min: 0.000001 }
  loss: { type: cross_entropy, class_weighted: true, label_smoothing: 0.1 }
evaluation:
  protocols: [1x1]
  save_misclassified: true
  sliding_window: { overlap: 0.2 }
