  - 480
  - 832
  frames: 81
  fps: 16
  steps: 40
  guidance: 4.0
  guidance_2: 3.0
  flow_shift: 3.0
speed:
  compile: true
sampling:
  classes:
  - ArmFlapping
  slow_factor: 2.0
  min_cycles: 2
v2v:
  source: /storage/pvc-trubaai-1tb/siu/smoke_v11/ArmFlapping/wan2.2-14b-480p_ArmFlapping_0002.mp4
  strengths:
  - 0.5
  - 0.65
  - 0.8
  targets:
    from_plan:
      cls: ArmFlapping
      topography: af_sides
      pool: 40
      seed: 11
      n: 3
output:
  root: /storage/pvc-trubaai-1tb/siu/v2v_af
