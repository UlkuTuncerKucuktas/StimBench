# `strength` and denoised under a fresh af_sides prompt; lower strength keeps more of the source.
experiment:
  name: v2v_armflapping
  seed: 0
model:
  key: wan2.2-14b-480p
  repo: Wan-AI/Wan2.2-T2V-A14B-Diffusers
